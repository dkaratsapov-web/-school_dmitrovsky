name: Публикация превью на GitHub Pages

on:
  push:
    branches: [claude/wizardly-franklin-g4tq99]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов
        run: npm run typecheck

      - name: Линтер
        run: npm run lint

      - name: Статическая сборка под Pages
        run: npm run build:pages
        env:
          # Вход в админку по почте. Значения публичные (адрес проекта
          # и анонимный ключ) и задаются в Settings -> Secrets and
          # variables -> Actions -> Variables. Пока их нет, админка
          # открывается без входа — как раньше.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      # Без этого файла GitHub Pages игнорирует папку _next
      - name: Отключить Jekyll
        run: touch out/.nojekyll

      # Pages должны быть включены в настройках репозитория:
      # Settings -> Pages -> Source: GitHub Actions.
      # Токен workflow не имеет прав включить их сам.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Права нужны и на самой задаче: без id-token deploy-pages не может
    # получить OIDC-токен и падает с «Ensure GITHUB_TOKEN has permission».
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
